[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circadian-as"
version = "0.1.0"
description = "Coverage-aware exploratory circadian alternative-splicing analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/zhangfei1947/circaAS"
Issues = "https://github.com/zhangfei1947/circaAS/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
circadian-as = "circadian_as.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"circadian_as.engines._legacy" = ["*.json"]
