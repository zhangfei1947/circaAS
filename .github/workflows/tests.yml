name: Package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install package and build tools
        run: python -m pip install . build
      - name: Unit and numerical regression tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python examples/make_demo.py --out demo.jsonl
          circadian-as run --input demo.jsonl --out demo-run --bootstrap 9 --workers 2
          python validation/check_run.py demo-run
      - name: Build distribution
        run: python -m build
